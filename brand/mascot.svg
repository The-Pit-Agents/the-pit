<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5fd6"/><stop offset="1" stop-color="#ff2bbf"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbff6a"/><stop offset="1" stop-color="#f0fa1e"/></linearGradient>
  </defs>
  <!-- body -->
  <path d="M44 236 C44 180 76 158 120 158 C164 158 196 180 196 236 Z" fill="#2b2660" stroke="#0d0b1a" stroke-width="7" stroke-linejoin="round"/>
  <!-- belt -->
  <rect x="86" y="196" width="68" height="20" rx="10" fill="url(#hd)" stroke="#0d0b1a" stroke-width="6"/>
  <circle cx="120" cy="206" r="7" fill="#ff3dcb" stroke="#0d0b1a" stroke-width="4"/>
  <!-- neck -->
  <rect x="102" y="140" width="36" height="28" rx="6" fill="#0d0b1a"/>
  <!-- antenna -->
  <line x1="120" y1="46" x2="120" y2="22" stroke="#0d0b1a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="18" r="10" fill="url(#gl)" stroke="#0d0b1a" stroke-width="6"/>
  <!-- ears -->
  <rect x="44" y="78" width="22" height="34" rx="8" fill="#f4f1ff" stroke="#0d0b1a" stroke-width="6"/>
  <rect x="174" y="78" width="22" height="34" rx="8" fill="#f4f1ff" stroke="#0d0b1a" stroke-width="6"/>
  <!-- head -->
  <rect x="58" y="46" width="124" height="104" rx="30" fill="url(#hd)" stroke="#0d0b1a" stroke-width="7"/>
  <!-- visor -->
  <rect x="74" y="72" width="92" height="40" rx="14" fill="#0d0b1a"/>
  <!-- eyes (angry slant) -->
  <path d="M84 102 L84 88 L112 82 L112 102 Z" fill="#4dffb4"/>
  <path d="M156 102 L156 88 L128 82 L128 102 Z" fill="#4dffb4"/>
  <rect x="88" y="90" width="8" height="6" fill="#ffffff" opacity=".7"/>
  <rect x="144" y="90" width="8" height="6" fill="#ffffff" opacity=".7"/>
  <!-- grill -->
  <line x1="104" y1="122" x2="104" y2="136" stroke="#0d0b1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="122" x2="120" y2="136" stroke="#0d0b1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="136" y1="122" x2="136" y2="136" stroke="#0d0b1a" stroke-width="6" stroke-linecap="round"/>
  <!-- gloves -->
  <g>
    <rect x="22" y="190" width="40" height="22" rx="7" fill="#f4f1ff" stroke="#0d0b1a" stroke-width="6"/>
    <circle cx="46" cy="166" r="34" fill="url(#gl)" stroke="#0d0b1a" stroke-width="7"/>
    <circle cx="72" cy="150" r="13" fill="url(#gl)" stroke="#0d0b1a" stroke-width="6"/>
    <path d="M26 154 C30 140 42 134 54 136" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  </g>
  <g>
    <rect x="178" y="190" width="40" height="22" rx="7" fill="#f4f1ff" stroke="#0d0b1a" stroke-width="6"/>
    <circle cx="194" cy="166" r="34" fill="url(#gl)" stroke="#0d0b1a" stroke-width="7"/>
    <circle cx="168" cy="150" r="13" fill="url(#gl)" stroke="#0d0b1a" stroke-width="6"/>
    <path d="M174 154 C178 140 190 134 202 136" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
